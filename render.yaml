# Render Blueprint for MONEVA.
#
# Create this stack from the Render dashboard with "New +" -> "Blueprint" and
# point it at this repository. Render reads this file and provisions the API
# service. The database is NOT here - see below.
#
# WHY POSTGRES AND NOT SQLITE:
# Render's service filesystem is ephemeral - it is wiped on every deploy and
# every restart. A SQLite file would silently lose every user, account and
# transaction. The app already speaks Postgres; it just needs the URL.
#
# WHY THE DATABASE IS NOT DECLARED HERE ANY MORE:
# It used to be, as a `databases:` block on plan basic-256mb, with a comment
# warning that the free plan expires after about thirty days and takes its
# contents with it. The database that actually got created was on the free
# plan regardless, so the running stack never matched this file - and on
# 2026-10-01 it expired exactly as the comment said it would, taking the API
# down and locking the data behind an upgrade.
#
# Postgres now lives on Neon's free plan, which is permanent rather than a
# trial: "The Free plan is permanent (not a trial)". Render hosts the API and
# nothing else, and DATABASE_URL is set by hand in the dashboard.

services:
  - type: web
    name: moneva-api
    runtime: python
    # Starter, not free. Measured on the free plan: a cold request answered in
    # 42.9 seconds, of which 0.14 was the network - it sleeps after 15 idle
    # minutes and the rest is the wake-up. No amount of client work fixes that;
    # the client already fetches in parallel behind a skeleton. Starter does
    # not sleep.
    plan: starter
    # The API lives in a subdirectory of the repo.
    rootDir: services/api
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # Migrations run before the server accepts traffic, so a deploy can never
    # serve a schema older than the code.
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # sync: false, NOT fromDatabase. This is the whole reason the block
      # above was removed rather than merely commented out: fromDatabase
      # rewrites the value on every blueprint apply, so leaving it would have
      # silently repointed the live service at a database that no longer
      # exists, the next time anyone synced this file.
      #
      # The value is Neon's DIRECT connection string - the host must NOT
      # contain "-pooler". The pooled endpoint is PgBouncer in transaction
      # mode, and asyncpg relies on prepared statements; the two fail together
      # intermittently under load. app/db/url.py converts the scheme to
      # +asyncpg and strips sslmode and channel_binding, so Neon's string is
      # pasted in exactly as given.
      - key: DATABASE_URL
        sync: false

      # Password-reset email. `sync: false` means Render prompts for the value
      # in the dashboard and never reads it from this file - which is the only
      # correct place for a mail password, since this file is in git.
      #
      # Without these the reset endpoint still works: it writes the code to the
      # service log instead of sending it. That is fine for a smoke test and
      # useless for a real user, so set them before anyone else signs up.
      #
      # SMTP ON PORT 587 DOES NOT WORK FROM HERE. Measured, not assumed:
      # correct Gmail credentials that authenticate in 2 seconds from a laptop
      # produce a connection from this service that hangs until the socket
      # times out ~20 seconds later, and no mail is ever sent. Hosts commonly
      # block outbound SMTP to deter spam. Nothing in the logs says so,
      # because a blocked port does not refuse - it simply never answers.
      #
      # Before assuming every port is blocked, ASK:
      #     GET /api/health/mail-probe
      # It opens a bare socket to Gmail's 587, 465 and 25 and reports which
      # answer. No credentials involved. If 465 is open, set SMTP_PORT=465 and
      # mail works with the Gmail account already configured - the sender code
      # also falls back to the other port on its own.
      #
      # If NO port is open, SMTP is impossible from this host and the reset
      # email needs an HTTPS provider. Set RESEND_API_KEY below and clear the
      # SMTP values (443 is not blocked); the sender already falls through to
      # it when SMTP fails. In that case RESET_EMAIL_FROM must be an address
      # that provider may send as - "MONEVA <onboarding@resend.dev>" works on
      # a fresh account - because a gmail.com sender will be rejected there.
      # THE ROUTE THAT WORKS FROM HERE. An HTTPS relay you host yourself -
      # services/api/docs/gmail-relay.gs is the ten lines to paste into
      # script.google.com. Sends from your own Gmail, needs no account with
      # any third party, and travels over 443 rather than a blocked SMTP port.
      # Set both of these and leave the SMTP values below empty.
      - key: MAIL_RELAY_URL
        sync: false        # https://script.google.com/macros/s/..../exec
      - key: MAIL_RELAY_TOKEN
        sync: false        # the same secret as SHARED_SECRET in that script

      - key: SMTP_HOST
        sync: false        # smtp.gmail.com - BLOCKED on Render, see above
      - key: SMTP_PORT
        sync: false        # 587
      - key: SMTP_USER
        sync: false        # the full Gmail address
      - key: SMTP_PASSWORD
        sync: false        # a Google APP PASSWORD, not the account password
      - key: RESET_EMAIL_FROM
        sync: false        # MONEVA <that same address>

      # Render generates a strong value once and keeps it. The app refuses to
      # start with a secret shorter than 32 characters.
      - key: JWT_SECRET
        generateValue: true

      - key: ENVIRONMENT
        value: production

      # With ENVIRONMENT=production the API stops using a wildcard CORS policy
      # and honours this list. `http://localhost` is the Capacitor WebView's
      # own origin (capacitor.config.ts sets androidScheme: 'http') - without
      # it the Android app's requests are blocked.
      - key: ALLOWED_ORIGINS
        value: http://localhost,capacitor://localhost,https://localhost

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "60"

      - key: PYTHON_VERSION
        value: "3.12.6"

      # Set this yourself in the Render dashboard (Environment -> Add Secret).
      # Leave it blank and the assistant falls back to the rule engine.
      - key: GEMINI_API_KEY
        sync: false

      # ------------------------------------------------------------------
      # WHAT THE APP IS TOLD WHEN IT CHECKS FOR AN UPDATE.
      #
      # These four are why an audit found 1.0.2 invisible to every existing
      # user: the APK was built, signed, published and reachable, and nothing
      # pointed at it. /app/version reads these env vars and nothing else, so
      # unset means it answers version_code 0 - which the client is required to
      # read as "no release exists" and treat as silence.
      #
      # Nothing fails when they are missing. The server returns 200, the app
      # says "you are up to date", and the only symptom is a prompt that never
      # appears. That is exactly how the step got skipped, so it is declared
      # here: Render shows a `sync: false` key as required on the service, and
      # scripts/release.mjs prints the values to paste after every build.
      #
      # RAISE ALL FOUR TOGETHER, and use the Cloudflare URL - the GitHub
      # release asset 404s for anyone once the repository is private, and the
      # app would fail mid-download.
      # ------------------------------------------------------------------
      - key: LATEST_VERSION_CODE
        sync: false        # 10002 - MAJOR*10000 + MINOR*100 + PATCH
      - key: LATEST_VERSION_NAME
        sync: false        # 1.0.2 - must match the versionCode above
      - key: APK_DOWNLOAD_URL
        sync: false        # https://moneva.monev.workers.dev/downloads/moneva-1.0.2.apk
      - key: LATEST_RELEASE_NOTES
        sync: false        # one line; it is what makes someone take the update
      - key: LATEST_VERSION_MANDATORY
        sync: false        # "true" only when an older build is genuinely unsafe
