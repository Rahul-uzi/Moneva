ext {
    /*
     * The app's version, in one place.
     *
     * versionCode is the integer Android compares to decide whether an APK is
     * an upgrade. It must increase on every build anyone might install, and it
     * is never shown to a person. versionName is what a person reads.
     *
     * The scheme is MAJOR * 10000 + MINOR * 100 + PATCH, so 1.0.0 is 10000 and
     * 1.2.3 is 10203. That keeps the two readable against each other - a code
     * of 10203 says 1.2.3 at a glance - and leaves room for 99 patches without
     * ever needing to renumber. A bare counter drifts away from the name and
     * then nobody can tell which build a bug report came from.
     *
     * MONEVA is installed from a website, not a store, so nothing bumps these
     * automatically and nothing updates itself. Raise them here, and the About
     * screen, the crash records and the update check all follow.
     */
    monevaVersionCode = 10000
    monevaVersionName = '1.0.0'

    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}